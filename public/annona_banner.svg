<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">Annona — Good food finds its way</title>
  <desc id="desc">A wide cream and green Annona banner, with a stylized green A-and-leaf emblem based on the Annona logo, the Annona wordmark, and the slogan Good food finds its way.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCFDF9"/>
      <stop offset="0.55" stop-color="#F5FAF2"/>
      <stop offset="1" stop-color="#E9F4E9"/>
    </linearGradient>
    <radialGradient id="halo" cx="46%" cy="43%" r="70%">
      <stop offset="0" stop-color="#E7F5DB"/>
      <stop offset="0.75" stop-color="#D8EDCF"/>
      <stop offset="1" stop-color="#CBE5C4"/>
    </radialGradient>
    <linearGradient id="symbolGreen" x1="0.42" y1="0" x2="0.78" y2="1">
      <stop offset="0" stop-color="#064630"/>
      <stop offset="0.34" stop-color="#116540"/>
      <stop offset="0.7" stop-color="#2E9250"/>
      <stop offset="1" stop-color="#69B744"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0" y1="0" x2="0.91" y2="1">
      <stop offset="0" stop-color="#0B5635"/>
      <stop offset="0.4" stop-color="#178043"/>
      <stop offset="1" stop-color="#69B747"/>
    </linearGradient>
    <linearGradient id="leftSwoop" x1="0.3" y1="0" x2="0.18" y2="1">
      <stop offset="0" stop-color="#0D5139"/>
      <stop offset="0.65" stop-color="#187440"/>
      <stop offset="1" stop-color="#61B144"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5FA56C"/>
      <stop offset="1" stop-color="#9ACC8F" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="canvas"><rect width="1600" height="540"/></clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1600" height="540" fill="url(#paper)"/>
    <!-- Light botanical forms in the background echo the logo's leaf. -->
    <path d="M1321 -134 C1436 -12 1504 151 1639 212 L1655 -98Z" fill="#D3EBD0" opacity="0.42"/>
    <path d="M1456 -16 C1513 79 1556 137 1641 181" fill="none" stroke="#81BA8B" stroke-width="2" opacity="0.22"/>
    <path d="M1184 533 C1352 432 1470 416 1646 470" fill="none" stroke="#95C59D" stroke-width="2" opacity="0.34"/>
    <path d="M1264 540 C1374 494 1484 498 1607 516" fill="none" stroke="#9DCFA2" stroke-width="1.6" opacity="0.27"/>
    <path d="M1358 327 C1376 245 1450 200 1559 217 C1545 320 1488 392 1358 406 C1408 355 1461 306 1527 260" fill="none" stroke="#83B88F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.17"/>
    <circle cx="1525" cy="89" r="6" fill="#8BBF83" opacity="0.31"/>
    <circle cx="1299" cy="446" r="4" fill="#8BBF83" opacity="0.35"/>

    <!-- Emblem backdrop: soft, naturally rounded instead of a hard-edged plaque. -->
    <circle cx="272" cy="268" r="193" fill="url(#halo)" opacity="0.66"/>
    <circle cx="272" cy="268" r="173" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.62"/>
    <circle cx="91" cy="394" r="7" fill="#87B97D" opacity="0.30"/>
    <circle cx="458" cy="139" r="5" fill="#87B97D" opacity="0.29"/>

    <!-- Vector reconstruction of the original Annona A / leaf mark. -->
    <g transform="translate(135 150) scale(.52)">
      <!-- Outer, ribbon-like A. -->
      <path d="M266 2 C304 2 338 22 360 63 L520 339 C543 381 526 415 485 415 C441 415 408 388 371 330 C399 310 419 280 429 240 C437 211 432 197 426 183 C395 157 367 145 336 145 C276 143 229 181 204 234 L148 348 C126 390 93 416 53 415 C10 414 -5 384 17 343 L172 64 C195 23 227 2 266 2 Z" fill="url(#symbolGreen)"/>
      <!-- The shaded fold on the lower left creates the logo's organic folded-ribbon feeling. -->
      <path d="M17 343 L88 215 C74 270 89 307 139 350 L148 348 C126 390 93 416 53 415 C10 414 -5 384 17 343 Z" fill="url(#leftSwoop)" opacity="0.82"/>
      <!-- A crisp curved negative-space aperture, opening around the leaf. -->
      <path d="M145 367 C169 339 182 300 197 269 C214 232 230 199 251 179 C280 148 307 142 336 145 C367 145 395 157 426 183 C435 203 435 224 429 240 C420 208 401 189 367 179 C317 164 278 179 251 218 C226 255 216 304 198 344 C181 370 166 384 145 390 Z" fill="#E5F2DB"/>
      <!-- The separate green leaf within the A aperture. -->
      <path d="M203 367 C217 285 264 187 411 194 C398 299 324 365 203 367 Z" fill="url(#leafGreen)"/>
      <path d="M207 363 C253 315 314 263 385 216" fill="none" stroke="#E8F4DE" stroke-width="4.5" stroke-linecap="round" opacity="0.95"/>
    </g>

    <!-- Annona's name and verified slogan. -->
    <g>
      <text x="552" y="253" fill="#0B4933" font-family="Inter, 'Avenir Next', 'Nunito Sans', Arial, sans-serif" font-size="114" font-weight="750" letter-spacing="-6">Annona</text>
      <rect x="558" y="285" width="76" height="5" rx="2.5" fill="#4EA364"/>
      <rect x="648" y="285" width="280" height="5" rx="2.5" fill="url(#rule)" opacity="0.65"/>
      <text x="554" y="355" fill="#366F4D" font-family="Inter, 'Avenir Next', Arial, sans-serif" font-size="45" font-weight="500" letter-spacing="-.7">Good food finds its way.</text>
    </g>
  </g>
</svg>
